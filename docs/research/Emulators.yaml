# Emulators.yaml - generated concatenation of Playnite source/Playnite/Emulation/Emulators/<Name>/emulator.yaml
# Source: https://github.com/JosefNemec/Playnite master @ 3e8abb241873e326e27c75b59dd0d2ea367698e3 (2026-10-19). License: MIT (c) 2020 Josef Nemec.
# Playnite itself loads each directory's emulator.yaml separately (Playnite/Emulators/Emulation.cs: Definitions); this file is a YAML list of those documents.
# --- Emulators/4DO/emulator.yaml
- Id: 4do
  Name: 4DO
  Website: 'https://sourceforge.net/projects/fourdo/'
  Profiles:
    - Name: Default
      StartupArguments: '-StartLoadFile "{ImagePath}" --StartFullScreen'  
      Platforms: [3do]
      ImageExtensions: [cue, bin, iso]
      InstallationFile: ^4do\.exe$
      StartupExecutable: ^4do\.exe$
# --- Emulators/Altirra/emulator.yaml
- Id: altirra
  Name: Altirra
  Website: 'http://www.virtualdub.org/altirra.html'
  Profiles:
    - Name: Atari 8-bit
      StartupArguments: '"{ImagePath}"'
      Platforms: [atari_8bit]
      ImageExtensions: [atr, atx, xfd, dcm, pro, cas, wav, rom, bin, car, xex, obx, com, arc, sap, zip]
      StartupExecutable: ^altirra\.exe$
    - Name: Atari 5200
      StartupArguments: '/hardware:5200 /kernel:5200 "{ImagePath}"'
      Platforms: [atari_5200]
      ImageExtensions: [rom, bin, car, a52, zip]
      StartupExecutable: ^altirra\.exe$
